<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0B0E">
<meta name="description" content="Compare BAIC, ARCFOX and FOTON vehicles in Brunei. View prices and available monthly payment tenures, then enquire with Muez on WhatsApp.">
<title>ASK MUEZ | TCY Motors Brunei — Compare Vehicles</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0B0E;--card:#15171C;--card2:#1B1E24;--line:#272A31;--ink:#F3F4F6;--sub:#8B93A1;
 --red:#E4262C;--redtint:rgba(228,38,44,.14);--disp:'Barlow Condensed',sans-serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.45}
.app{max-width:640px;margin:0 auto;padding:14px 14px 90px}
.hd{display:flex;align-items:center;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.hd .tcy{font-family:var(--disp);font-weight:700;font-size:14px}
.hd .sub2{display:block;color:var(--sub);font-size:9.5px;letter-spacing:.08em}
h1{font-family:var(--disp);font-size:25px;font-weight:700;margin:14px 0 4px}
.lead{color:var(--sub);font-size:13px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:13px;overflow:hidden;position:relative}
.card.sel{border-color:var(--red)}
.media{height:100px;background:#1C1F26;position:relative}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.ci{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#454B56}
.badge{position:absolute;top:7px;left:7px;background:#fff;color:#111;border-radius:20px;padding:2px 9px;font-size:9.5px;font-weight:700}
.badge.new{background:var(--red);color:#fff}
.cb{padding:9px}
.cb b{font-size:13.5px;display:block;font-family:var(--disp)}
.cb .pr{color:var(--red);font-weight:700;font-size:13px;margin:3px 0 8px;display:block}
.cb .pr small{color:var(--sub);font-weight:400;font-size:10.5px}
.picks{display:flex;gap:6px}
.picks button{flex:1;font:inherit;font-size:11px;font-weight:700;border-radius:7px;padding:8px 2px;cursor:pointer;border:1.5px solid var(--line);background:var(--card2);color:var(--ink)}
.picks button.cmp[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card2);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;z-index:9}
.bar span{font-size:12.5px;color:var(--sub);flex:1}
.bar button{font:inherit;font-weight:700;font-size:13px;background:var(--red);color:#fff;border:0;border-radius:9px;padding:11px 16px;cursor:pointer}
.bar button:disabled{opacity:.35}
.cmpwrap{display:grid;gap:12px;margin:10px 0 16px}
.cmpcard{background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:12px}
.cmpcard .top{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.cmpcard .top img{width:64px;height:46px;object-fit:cover;border-radius:7px}
.cmpcard .top .ci{width:64px;height:46px;border-radius:7px}
.cmpcard .nm{font-family:var(--disp);font-size:16px}
.cmpcard .pr{color:var(--red);font-weight:700;font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px;margin-top:4px}
.kv .k{color:var(--sub)}
.kv .v{font-weight:600;text-align:right}
.tbc{color:var(--sub);font-style:italic;font-weight:400}
.standout{background:var(--card2);border-radius:8px;padding:7px 10px;font-size:11.5px;margin-top:8px;color:var(--ink)}
details.full{margin-top:8px}
details.full summary{color:var(--red);font-size:11.5px;cursor:pointer}
.fullgrid{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:11px;margin-top:6px;color:var(--sub)}
.disclaimer{color:var(--sub);font-size:10.5px;margin:12px 0;line-height:1.6}
details.admin{margin-top:18px;border-top:1px solid var(--line);padding-top:8px}
details.admin summary{color:#555A63;font-size:9.5px;cursor:pointer}
.admin p{font-size:10px;color:var(--sub)}
.foot{color:#555A63;font-size:9px;text-align:center;margin-top:10px}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:30px 10px}

.brandbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:0 0 22px}.brandbtn{min-height:43px;padding:9px 5px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:700 12px Inter,system-ui,sans-serif;cursor:pointer}.brandbtn.active{border-color:var(--red);background:var(--redtint);color:#fff}.paymentlabel{display:block;color:var(--sub);font-size:11px;margin-top:4px;line-height:1.4}.hd .tcy{font-family:var(--disp);font-size:25px;letter-spacing:.04em;color:var(--ink);font-weight:700}.hd .sub2{font-size:10px;letter-spacing:.08em;color:var(--sub);display:block;margin-top:2px}.cb .pr{display:block;margin-top:4px}
@media(max-width:390px){.brandbar{grid-template-columns:repeat(2,minmax(0,1fr))}}

.brandbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:8px 0 18px}
.brandbtn{min-height:88px;padding:10px 8px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:700 12px Inter,system-ui,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:border-color .15s,background .15s}
.brandbtn img{display:block;width:100%;height:43px;max-width:150px;object-fit:contain;background:#fff;border-radius:6px;padding:4px}
.brandbtn.active{border-color:var(--red);background:var(--redtint);color:#fff}
.allfilter{display:flex;justify-content:center;margin:0 0 18px}
.allfilter button{border:1px solid var(--line);border-radius:20px;padding:7px 14px;background:var(--card2);color:var(--ink);font:600 11px Inter,system-ui,sans-serif;cursor:pointer}
.allfilter button.active{border-color:var(--red);background:var(--redtint)}
.filterstatus{margin:0 0 12px;color:var(--muted);font-size:12px;font-weight:600;text-align:center}
@media(max-width:390px){.brandbar{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.brandbtn{min-height:78px;padding:7px 3px;font-size:10px}.brandbtn img{height:34px}}


.gallery{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:thin;scrollbar-color:#555 transparent;background:#101216}
.gallery img{flex:0 0 100%;width:100%;height:100%;object-fit:contain;scroll-snap-align:start;background:#101216}
.variantlist{display:grid;gap:5px;margin:9px 0 10px}
.variantrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:var(--card2);font-size:10.5px}
.variantrow span{font-weight:600;min-width:0}
.variantrow strong{font-size:10.5px;color:var(--ink);white-space:nowrap}
.variantrow small{grid-column:1/-1;color:var(--sub);font-size:9.5px;line-height:1.4}

</style>
</head>

let cmp=[];
let activeBrand='ALL';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>Number(n||0).toLocaleString('en-US');
const fam=id=>FAMILIES.find(f=>f.id===id);
const v=x=>x===null||x===undefined ? '<span class="tbc">To be confirmed</span>' : esc(x);
function bestTerm(f){ const ks=Object.keys(f.m).map(Number).sort((a,b)=>a-b); return ks[0]; }
function media(f){
  if(f.gallery && f.gallery.length) return `<div class="gallery" aria-label="${esc(f.name)} vehicle photo gallery">${f.gallery.map((src,i)=>`<img loading="lazy" src="${src}" alt="${esc(f.name)} photo ${i+1} of ${f.gallery.length}" ${i===0?'fetchpriority="high"':''}>`).join('')}</div>`;
  return f.photo?`<img loading="lazy" src="data:image/jpeg;base64,${ASSETS[f.photo]}" alt="${esc(f.name)}">`:`<div class="ci"></div>`;
}

function header(){
  const brands=[
    {id:'BAIC',label:'BAIC',asset:'baic_logo'},
    {id:'ARCFOX',label:'ARCFOX',asset:'arcfox_logo'},
    {id:'FOTON',label:'FOTON',asset:'foton_logo'}
  ];
  return `<div class="hd"><div><span class="tcy">ASK MUEZ</span><span class="sub2">TCY MOTORS BRUNEI · VEHICLE FINDER</span></div></div>
  <div class="brandbar" aria-label="Choose a vehicle brand">${brands.map(b=>`<button type="button" class="brandbtn ${activeBrand===b.id?'active':''}" data-act="brand" data-brand="${b.id}" aria-label="Show only ${b.label} vehicles" aria-pressed="${activeBrand===b.id}" title="Show only ${b.label} vehicles"><img src="${ASSETS[b.asset].startsWith('data:')?ASSETS[b.asset]:'data:'+ASSETS[b.asset]}" alt="${b.label} logo"><span>${b.label}</span></button>`).join('')}</div>
  <div class="allfilter"><button type="button" class="${activeBrand==='ALL'?'active':''}" data-act="brand" data-brand="ALL" aria-pressed="${activeBrand==='ALL'}">View all vehicles</button></div>`;
}
function catalogue(){
  const visible=FAMILIES.filter(f=>activeBrand==='ALL'||f.brand===activeBrand);
  const filterLabel = activeBrand === 'ALL' ? 'Showing all vehicle brands' : `Showing ${esc(activeBrand)} vehicles only`;
  let h = `<h1>Browse &amp; Compare</h1><p class="lead">Choose up to 3 vehicles. Compare price, monthly payments and key details side by side.</p><p class="filterstatus" role="status" aria-live="polite">${filterLabel}</p><div class="grid">`;
  h += visible.map(f=>{
    const on=cmp.includes(f.id);
    const terms=Object.entries(f.m).sort((a,b)=>Number(a[0])-Number(b[0]));
    const payment=terms.length?`Quoted monthly: ${terms.map(([t,m])=>`${t}-yr BND ${num(m)}`).join(' · ')}`:'Monthly payment: confirm with Muez';
    return `<div class="card ${on?'sel':''}"><div class="media">${media(f)}${f.isNew?'<span class="badge new">NEW</span>':''}</div>
      <div class="cb"><b>${esc(f.name)}</b><span class="pr">${f.id==='cs2'?'From ':''}BND ${num(f.price)}</span><span class="paymentlabel">${payment}</span>
      <div class="variantlist">${SKUS.filter(s=>s.fam===f.id).map(s=>`<div class="variantrow"><span>${esc(s.variant)}</span><strong>BND ${num(s.price)}</strong><small>${Object.keys(s.m).length?Object.entries(s.m).sort((a,b)=>+a[0]-+b[0]).map(([t,m])=>`${t}-yr ${num(m)}/mo`).join(' · '):'Payment to be confirmed'}</small></div>`).join('')}</div>
      <div class="picks"><button class="cmp" aria-pressed="${on}" data-act="cmp" data-id="${f.id}">${on?'Added ✓':'+ Compare'}</button></div></div></div>`;
  }).join('');
  h += `</div>`;
  return h;
}
function fullSpecRow(label, val){ return `<div>${label}</div><div>${v(val)}</div>`; }
function compareCard(f){
  return `<div class="cmpcard"><div class="top">${media(f)}<div><div class="nm">${esc(f.name)}</div><div class="pr">BND ${num(f.price)}</div></div></div>
    <div class="kv">
      <div class="k">Quoted monthly payments</div><div class="v">${Object.keys(f.m).length?Object.entries(f.m).map(([t,m])=>`${t}yr: BND ${num(m)}/mo`).join(' / '):'Not quoted — calculate with consultant'}</div>
      <div class="k">Powertrain</div><div class="v">${v(f.powertrain)}</div>
      <div class="k">Fuel type</div><div class="v">${v(f.fuel)}</div>
      <div class="k">Seats</div><div class="v">${v(f.seats)}</div>
    </div>
    <div class="standout">${esc(f.standout)}</div>
    <details class="full"><summary>Full specifications &amp; variants</summary><div class="fullgrid">
      ${SKUS.filter(s=>s.fam===f.id).map(s=>`<div>${esc(s.variant)}</div><div>BND ${num(s.price)} — ${Object.keys(s.m).length?Object.entries(s.m).map(([t,m])=>`${t}yr BND ${num(m)}/mo`).join(', '):'Monthly payment not quoted'}</div>`).join('')}
    </div></details>
  </div>`;
}
function compareSection(){
  if(!cmp.length) return `<div class="empty">Select vehicles above to see them compared here.</div>`;
  return `<h1 style="margin-top:22px">Comparing ${cmp.length}</h1><div class="cmpwrap">${cmp.map(id=>compareCard(fam(id))).join('')}</div>
   <p class="disclaimer">Listed monthly payments are reference quotes supplied for this catalogue and remain subject to confirmation by TCY Motors and the financing bank. Only available quoted tenures are shown; missing terms are not invented. No payment has been invented. Deposit-based estimates require a separate calculation and bank confirmation.</p>`;
}
function genId(){ const d=new Date(); return `MUEZ-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${Math.random().toString(36).slice(2,6).toUpperCase()}`; }
function waLink(){
  const lines=[`*TCY Motors Brunei - Vehicle Comparison*`,`Attn: ${CONSULTANT.name}`,`ID: ${genId()}`,''];
  if(!cmp.length){ lines.push('Hi, I would like to speak with a sales consultant about BAIC / FOTON vehicles.'); }
  else{
    lines.push('I would like more information on:');
    cmp.forEach(id=>{ const f=fam(id); const t=bestTerm(f); lines.push(`- ${f.brand} ${f.name}: BND ${num(f.price)}${t!==undefined?` (${t}-year quoted payment BND ${num(f.m[t])}/mo)`:' (monthly payment to be confirmed)'}`); });
  }
  lines.push('', 'Reference figures only, pending confirmation.');
  return `https://wa.me/${CONSULTANT.wa}?text=${encodeURIComponent(lines.join('\n'))}`;
}
function saveLocal(){
  try{ const key='baicfoton_inquiries_muez_arifin'; const cur=JSON.parse(localStorage.getItem(key)||'[]');
    cur.push({ id:genId(), ts:new Date().toISOString(), compared:cmp.slice() });
    localStorage.setItem(key, JSON.stringify(cur)); }catch(e){}
}
function adminSection(){
  let n=0; try{ n=JSON.parse(localStorage.getItem('baicfoton_inquiries_muez_arifin')||'[]').length; }catch(e){}
  return `<details class="admin"><summary>Admin / System Information</summary>
   <p>${n} enquiries logged on this device. Full analytics need a backend/Jotform integration, not generated by this page.</p>
   <p>Original concept, workflow and structure by Muez Arifin. &copy; 2026 Muez Arifin. All Rights Reserved.</p></details>`;
}
function render(){
  let h = header() + catalogue() + compareSection();
  h += `<p class="foot">&copy; 2026 Muez Arifin. Concept &amp; design by Muez Arifin for TCY Motors Brunei | BAIC | ARCFOX | FOTON.</p>`;
  h += adminSection();
  $('#app').innerHTML = h;
  const bar = document.querySelector('.bar'); if(bar) bar.remove();
  const barHtml = document.createElement('div'); barHtml.className='bar';
  barHtml.innerHTML = `<span>${cmp.length? cmp.length+' selected' : 'Select vehicles to compare'}</span><button data-act="ask" ${!cmp.length?'disabled':''}>ASK MUEZ</button>`;
  document.body.appendChild(barHtml);
}
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act;
  if(act==='brand'){ activeBrand=el.dataset.brand||'ALL'; render(); }
  else if(act==='cmp'){
    const id=el.dataset.id; const i=cmp.indexOf(id);
    if(i>-1) cmp.splice(i,1); else if(cmp.length<3) cmp.push(id); else { alert('You can compare up to 3 vehicles at a time. Remove one to add another.'); return; }
    render();
  } else if(act==='ask'){
    saveLocal();
    window.open(waLink(), '_blank', 'noopener');
  }
});
render();
</script>
